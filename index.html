<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f9fc">
  <meta name="description" content="1ST MARKET — كل احتياجاتك من نفس المكان">
  <title>1ST MARKET | ماركت البيت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="icon-button menu-toggle" id="menu-toggle" aria-label="القائمة">☰</button>
      <a class="brand" href="#home" aria-label="1ST MARKET الصفحة الرئيسية"><span class="brand-crop"><img src="assets/brand.png" alt="1ST MARKET"></span></a>
      <label class="search-box"><span>⌕</span><input id="search-input" type="search" placeholder="ابحث عن منتجك المفضل..." autocomplete="off"></label>
      <button class="icon-button cart-shortcut" data-page="cart" aria-label="السلة">🛒<b id="cart-count">0</b></button>
    </header>
    <aside class="drawer" id="drawer">
      <div class="drawer-head"><span>أهلاً بيك في 1ST MARKET</span><button class="icon-button" id="close-drawer">×</button></div>
      <button data-page="home">🏠 الرئيسية</button><button data-page="orders">📦 طلباتي</button><button data-page="favorites">♡ المفضلة</button>
      <button data-page="account">👤 حسابي / تسجيل الدخول</button>
      <button id="notification-optin">🔔 تفعيل إشعارات المتجر</button>
      <div class="drawer-note">كل احتياجاتك من نفس المكان</div>
    </aside>
    <main id="view" class="main-content"></main>
    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button class="active" data-page="home"><span>⌂</span><small>الرئيسية</small></button><button data-page="orders"><span>▤</span><small>طلباتي</small></button><button class="nav-cart" data-page="cart"><span>🛒</span><small>السلة</small><b id="nav-cart-count">0</b></button><button data-page="favorites"><span>♡</span><small>المفضلة</small></button><button data-page="account"><span>♙</span><small>حسابي</small></button>
    </nav>
    <div id="toast" class="toast" role="status"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
</body>
</html>
